name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install LibreOffice and poppler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-impress poppler-utils
      - name: Install Python packages
        run: python -m pip install -r plugins/imprint/engine/requirements.txt
      - name: Build every template twice, verify, check for brand and client names
        run: python plugins/imprint/engine/tests/run.py --pdf
